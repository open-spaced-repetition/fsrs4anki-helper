name: autofix.ci
on:
  workflow_call:
  pull_request:
  push:
    branches: [ "main" ]
permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6
        with:
          version: "0.4.20"
      # Keep Ruff pinned to the required-version in ruff.toml.
      # Fix lint errors
      - run: uvx --from ruff==0.17.4 ruff check --fix-only .
      # Format code
      - run: uvx --from ruff==0.17.4 ruff format .

      - uses: autofix-ci/action@635ffb0c9798bd160680f18fd73371e355b85f27
      
